# HTTP Bootstrap Config - Client B (Subtle)
# Site 5 - Paleon Test Site
# Serves HTTP only, redirects to HTTPS after certs available

server {
    listen 80;
    listen [::]:80;
    server_name clientb.paleon-lab-msp.com;

    root /var/www/clientb;
    index index.html;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Security headers (minimal for HTTP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny hidden files (protect .git, .env, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Redirect to HTTPS (will be active after cert setup)
    location / {
        return 301 https://$server_name$request_uri;
    }
}