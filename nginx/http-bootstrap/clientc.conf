# HTTP Bootstrap Config - Client C (Neglected)
# Site 5 - Paleon Test Site
# Serves HTTP only, redirects to HTTPS after certs available
# ALLOWS .git access for test scenario

server {
    listen 80;
    listen [::]:80;
    server_name clientc.paleon-lab-msp.com;

    root /var/www/clientc;
    index index.html;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Security headers (minimal for HTTP)
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NOTE: Intentionally missing X-Content-Type-Options for subtle finding

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # ALLOW .git/HEAD and .git/config for neglected client test
    # These must return 200 with content
    location /.git/HEAD {
        try_files $uri =404;
        add_header Content-Type "text/plain";
    }

    location /.git/config {
        try_files $uri =404;
        add_header Content-Type "text/plain";
    }

    # Deny other hidden files (but not .git)
    location ~ /\.(?!well-known|git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Redirect to HTTPS (will be active after cert setup)
    location / {
        return 301 https://$server_name$request_uri;
    }
}