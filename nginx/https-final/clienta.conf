# HTTPS Final Config - Client A (Clean)
# Site 5 - Paleon Test Site
# Full security headers, Let's Encrypt certificate
# Contains ARN false-positive trap in /docs/api-reference.js

server {
    listen 80;
    listen [::]:80;
    server_name clienta.paleon-lab-msp.com;

    # ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clienta.paleon-lab-msp.com;

    root /var/www/clienta;
    index index.html;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/clienta.paleon-lab-msp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clienta.paleon-lab-msp.com/privkey.pem;

    # SSL Parameters
    include /etc/nginx/snippets/ssl-params.conf;

    # Security Headers - FULL SET (Clean)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # Deny hidden files (protect .git, .env, backups, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
}