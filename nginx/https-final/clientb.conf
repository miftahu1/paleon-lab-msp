# HTTPS Final Config - Client B (Subtle)
# Site 5 - Paleon Test Site
# Valid self-signed certificate expiring in ~10 days
# Missing X-Content-Type-Options header (intentional)
# All other headers present

server {
    listen 80;
    listen [::]:80;
    server_name clientb.paleon-lab-msp.com;

    # ACME challenge for Let's Encrypt renewal (not used for self-signed)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clientb.paleon-lab-msp.com;

    root /var/www/clientb;
    index index.html;

    # SSL Certificate (Self-signed, expiring ~10 days)
    ssl_certificate /etc/ssl/certs/clientb.paleon-lab-msp.com.crt;
    ssl_certificate_key /etc/ssl/certs/clientb.paleon-lab-msp.com.key;

    # SSL Parameters
    include /etc/nginx/snippets/ssl-params.conf;

    # Security Headers - SUBTLE (Missing X-Content-Type-Options)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # Deny hidden files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}