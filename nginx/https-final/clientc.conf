# HTTPS Final Config - Client C (Neglected)
# Site 5 - Paleon Test Site
# Self-signed certificate EXPIRED
# Missing HSTS header (intentional)
# Missing CSP header (intentional)
# DMARC p=none (DNS level)
# Allows .git/HEAD and .git/config access (intentional)
# Dummy PostgreSQL listener on port 5432 (separate service)

server {
    listen 80;
    listen [::]:80;
    server_name clientc.paleon-lab-msp.com;

    # ACME challenge for Let's Encrypt renewal (not used for self-signed)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clientc.paleon-lab-msp.com;

    root /var/www/clientc;
    index index.html;

    # SSL Certificate (Self-signed, EXPIRED)
    ssl_certificate /etc/ssl/certs/clientc.paleon-lab-msp.com.crt;
    ssl_certificate_key /etc/ssl/certs/clientc.paleon-lab-msp.com.key;

    # SSL Parameters
    include /etc/nginx/snippets/ssl-params.conf;

    # Security Headers - NEGLECTED (Missing HSTS, CSP)
    # NO HSTS header
    # NO Content-Security-Policy header
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # ALLOW .git/HEAD and .git/config for neglected client test
    # These MUST return 200 with content
    location /.git/HEAD {
        try_files $uri =404;
        add_header Content-Type "text/plain";
    }

    location /.git/config {
        try_files $uri =404;
        add_header Content-Type "text/plain";
    }

    # Deny other hidden files (but not .git)
    location ~ /\.(?!well-known|git) {
        deny all;
        access_log off;
        log_not_found off;
    }
}